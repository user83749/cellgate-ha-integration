name: Validate standalone Scrypted plugin
on:
  push:
    paths: ['scrypted_cellgate/**', '.github/workflows/scrypted-plugin.yaml']
  pull_request:
    paths: ['scrypted_cellgate/**', '.github/workflows/scrypted-plugin.yaml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plugin:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: scrypted_cellgate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scrypted_cellgate/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r src/requirements.txt pytest pytest-asyncio
      - run: python -m pytest tests -q
      - run: npm run build
      - run: python tests/check_bundle.py
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: cellgate-scrypted-standalone-plugin
          path: |
            scrypted_cellgate/out/plugin.zip
            scrypted_cellgate/*.tgz
